server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads: embedded HTML manuals (~2.5MB) and phone photos exceed the
    # 1MB nginx default. Django enforces its own 50MB cap.
    client_max_body_size 50M;

    # Resolve "backend" through Docker DNS on each request instead of once at
    # startup: when only the backend container is recreated its IP changes and
    # a cached address made every API call fail with 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # Backend API
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin + collected static
    location /static/ {
        alias /usr/share/nginx/static/;
    }

    # Uploaded files (photos, signatures, OT PDFs) — local volume storage
    location /media/ {
        alias /usr/share/nginx/media/;
    }

    # Django admin itself
    location /admin/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built JS/CSS carry a content hash in the name, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA routing — everything else falls back to index.html. index.html must
    # be revalidated on every load so a new deploy shows without Ctrl+Shift+R.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
